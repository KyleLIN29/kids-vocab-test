<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="单词听听看">
  <meta name="theme-color" content="#FFF6E9">
  <title>单词听听看 · 词汇量小测试</title>
  <style>
    :root {
      --bg1: #FFF6E9;
      --bg2: #D9F0FF;
      --ink: #2B2A4A;
      --muted: #6B6A86;
      --card: #ffffff;
      --accent: #FF8A5B;
      --accent-dark: #E56F40;
      --sky: #5BB4E8;
      --sky-dark: #3A98D0;
      --ok-soft: #EEF8F0;
      --shadow: 0 10px 30px rgba(43, 42, 74, 0.10);
      --radius: 28px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      overflow: hidden;
    }

    body {
      min-height: 100dvh;
      min-height: 100vh;
    }

    #app {
      min-height: 100dvh;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: env(safe-area-inset-top, 12px) 20px env(safe-area-inset-bottom, 16px);
    }

    .screen { display: none; width: 100%; max-width: 1100px; flex: 1; }
    .screen.active { display: flex; flex-direction: column; align-items: center; }

    /* —— Start —— */
    #screen-start { justify-content: center; text-align: center; gap: 12px; }
    .logo {
      width: 112px; height: 112px;
      border-radius: 32px;
      background: #fff;
      box-shadow: var(--shadow);
      display: flex; align-items: center; justify-content: center;
      font-size: 64px;
      margin-bottom: 8px;
    }
    h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 48px);
      letter-spacing: 0.04em;
    }
    .subtitle { margin: 0; color: var(--muted); font-size: 18px; }
    .hint {
      margin: 8px 0 28px;
      max-width: 420px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }
    .btn {
      appearance: none;
      border: none;
      cursor: pointer;
      font: inherit;
      touch-action: manipulation;
    }
    .btn-start {
      background: var(--accent);
      color: #fff;
      font-size: 32px;
      font-weight: 700;
      padding: 20px 88px;
      border-radius: 999px;
      box-shadow: 0 8px 0 var(--accent-dark), var(--shadow);
      min-width: 240px;
      min-height: 80px;
    }
    .btn-start:active { transform: translateY(4px); box-shadow: 0 4px 0 var(--accent-dark); }
    .parent-note { margin-top: 28px; font-size: 13px; color: #9A99B0; }

    /* —— Quiz —— */
    #screen-quiz { justify-content: flex-start; }
    .quiz-top {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 4px 12px;
    }
    .progress-wrap { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .progress-label { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .progress-bar {
      height: 10px; background: rgba(255,255,255,0.7);
      border-radius: 99px; overflow: hidden;
    }
    .progress-bar > span {
      display: block; height: 100%; width: 0%;
      background: var(--sky);
      border-radius: 99px;
      transition: width 0.35s ease;
    }

    .speaker {
      margin: 4px 0 16px;
      width: 92px; height: 92px;
      border-radius: 50%;
      background: var(--sky);
      color: #fff;
      box-shadow: 0 6px 0 var(--sky-dark), var(--shadow);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .speaker:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--sky-dark); }
    .speaker.playing { animation: pulse 0.9s ease-in-out infinite; }
    .speaker svg { width: 48px; height: 48px; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    .choices {
      width: 100%;
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      align-content: center;
      padding: 4px 0 12px;
    }
    .choice {
      background: var(--card);
      border: 4px solid transparent;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      cursor: pointer;
      min-height: 180px;
      aspect-ratio: 1;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.25s ease;
    }
    .choice img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }
    .choice:active { transform: scale(0.97); }
    .choice.picked {
      transform: scale(1.04);
      border-color: #F3D27A;
      box-shadow: 0 12px 32px rgba(43, 42, 74, 0.16);
    }
    .choice.dim { opacity: 0.45; transform: scale(0.96); }
    .choices.leaving { opacity: 0; transform: translateY(8px); transition: opacity 0.28s ease, transform 0.28s ease; }
    .choices.entering { animation: enter 0.35s ease; }
    @keyframes enter {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }

    /* —— Result —— */
    #screen-result {
      justify-content: flex-start;
      overflow: auto;
      padding-bottom: 24px;
      -webkit-user-select: text;
      user-select: text;
    }
    .score-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px 24px 24px;
      text-align: center;
      width: 100%;
      max-width: 560px;
      margin-top: 20px;
    }
    .score-card h2 { margin: 0 0 8px; font-size: 28px; }
    .score-big {
      font-size: clamp(44px, 8vw, 64px);
      font-weight: 800;
      margin: 8px 0 0;
      letter-spacing: -0.02em;
    }
    .score-pct { color: var(--muted); font-size: 20px; margin: 4px 0 0; }
    .btn-again {
      margin-top: 20px;
      background: var(--accent);
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      padding: 14px 40px;
      border-radius: 999px;
      box-shadow: 0 6px 0 var(--accent-dark);
    }
    .btn-again:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--accent-dark); }

    .lists {
      width: 100%;
      max-width: 560px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 20px;
    }
    .list-card {
      background: var(--card);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 16px 16px 12px;
      min-height: 120px;
    }
    .list-card h3 {
      margin: 0 0 10px;
      font-size: 16px;
    }
    .list-card.known h3 { color: #2E8B57; }
    .list-card.unknown h3 { color: #C45C26; }
    .list-card ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .list-card li {
      background: #F6F4FF;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 15px;
      font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    }
    .list-card.unknown li { background: #FFF1E8; }
    .list-card .empty { color: #9A99B0; font-size: 14px; }

    @media (max-width: 640px) {
      .choices {
        grid-template-columns: 1fr;
        gap: 12px;
        overflow: auto;
        align-content: start;
      }
      .choice { min-height: 140px; aspect-ratio: auto; height: 28vh; max-height: 220px; }
      .speaker { width: 76px; height: 76px; }
      .speaker svg { width: 38px; height: 38px; }
      .lists { grid-template-columns: 1fr; }
    }

    @media (min-width: 641px) and (max-height: 700px) {
      .choice { min-height: 140px; }
      .speaker { width: 76px; height: 76px; margin-bottom: 8px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <section id="screen-start" class="screen active">
      <div class="logo" aria-hidden="true">🎧</div>
      <h1>单词听听看</h1>
      <p class="subtitle" id="subtitle">词汇量小测试</p>
      <p class="hint">点「开始」后会听到一个单词。<br>请让宝宝选出对应的那张图片。<br>听不清可以再点上面的小喇叭。</p>
      <button class="btn btn-start" id="btn-start" type="button">开 始</button>
      <p class="parent-note">给家长：这是一个样品，共 20 个 P5 单词。测试过程中不会显示英文单词。</p>
    </section>

    <section id="screen-quiz" class="screen">
      <div class="quiz-top">
        <div class="progress-wrap">
          <div class="progress-label" id="progress-label">1 / 20</div>
          <div class="progress-bar" aria-hidden="true"><span id="progress-fill"></span></div>
        </div>
      </div>
      <button class="btn speaker" id="btn-replay" type="button" aria-label="再听一次">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M8 18h8l10-8v28l-10-8H8V18z" fill="currentColor"/>
          <path d="M32 16c3.2 2.6 5 6.2 5 8s-1.8 5.4-5 8" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
          <path d="M36 11c5 4.2 7.8 9.6 7.8 13s-2.8 8.8-7.8 13" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
        </svg>
      </button>
      <div class="choices entering" id="choices"></div>
    </section>

    <section id="screen-result" class="screen">
      <div class="score-card">
        <h2>测试完成</h2>
        <div class="score-big" id="score-big">0 / 20</div>
        <p class="score-pct" id="score-pct">正确率 0%</p>
        <button class="btn btn-again" id="btn-again" type="button">再测一次</button>
      </div>
      <div class="lists">
        <div class="list-card known">
          <h3>会的单词</h3>
          <ul id="list-known"></ul>
        </div>
        <div class="list-card unknown">
          <h3>还不熟的单词</h3>
          <ul id="list-unknown"></ul>
        </div>
      </div>
    </section>
  </div>

  <script src="words.js"></script>
  <script>
    (function () {
      "use strict";

      const audio = new Audio();
      audio.preload = "auto";

      let data = null;
      let pool = [];
      let queue = [];
      let index = 0;
      let answers = [];
      let locked = false;
      let currentChoices = [];

      const $ = (id) => document.getElementById(id);
      const screens = {
        start: $("screen-start"),
        quiz: $("screen-quiz"),
        result: $("screen-result"),
      };

      function show(name) {
        Object.keys(screens).forEach((k) => {
          screens[k].classList.toggle("active", k === name);
        });
      }

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const t = a[i]; a[i] = a[j]; a[j] = t;
        }
        return a;
      }

      function playCurrent() {
        const item = queue[index];
        if (!item) return;
        try {
          audio.pause();
          audio.currentTime = 0;
        } catch (e) {}
        audio.src = item.audio;
        const p = audio.play();
        if (p && p.catch) p.catch(function () { /* autoplay may be blocked until a tap */ });
        const btn = $("btn-replay");
        btn.classList.add("playing");
        const stopPulse = function () { btn.classList.remove("playing"); };
        audio.onended = stopPulse;
        audio.onpause = stopPulse;
      }

      function pickDistractors(correct, all) {
        const sameLevel = all.filter(function (w) {
          return w.word !== correct.word && w.level === correct.level;
        });
        const src = sameLevel.length >= 2 ? sameLevel : all.filter(function (w) { return w.word !== correct.word; });
        return shuffle(src).slice(0, 2);
      }

      function renderQuestion() {
        const item = queue[index];
        const total = queue.length;
        $("progress-label").textContent = (index + 1) + " / " + total;
        $("progress-fill").style.width = ((index + 1) / total * 100) + "%";

        const distractors = pickDistractors(item, pool);
        currentChoices = shuffle([item].concat(distractors));

        const box = $("choices");
        box.classList.remove("leaving");
        box.classList.add("entering");
        box.innerHTML = "";
        currentChoices.forEach(function (choice) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "choice";
          btn.setAttribute("data-word", choice.word);
          btn.setAttribute("data-correct", choice.word === item.word ? "1" : "0");
          btn.setAttribute("aria-label", "picture choice");
          const img = document.createElement("img");
          img.src = choice.image;
          img.alt = "";
          img.draggable = false;
          btn.appendChild(img);
          btn.addEventListener("click", function () { onPick(choice, btn); });
          box.appendChild(btn);
        });

        locked = false;
        playCurrent();
      }

      function onPick(choice, btn) {
        if (locked) return;
        locked = true;
        const item = queue[index];
        const correct = choice.word === item.word;
        answers.push({ word: item.word, level: item.level, correct: correct, picked: choice.word });

        const box = $("choices");
        Array.prototype.forEach.call(box.querySelectorAll(".choice"), function (el) {
          if (el === btn) el.classList.add("picked");
          else el.classList.add("dim");
        });

        window.setTimeout(function () {
          box.classList.remove("entering");
          box.classList.add("leaving");
          window.setTimeout(function () {
            index += 1;
            if (index >= queue.length) finish();
            else renderQuestion();
          }, 280);
        }, 450);
      }

      function finish() {
        try { audio.pause(); } catch (e) {}
        const total = answers.length;
        const right = answers.filter(function (a) { return a.correct; }).length;
        const pct = total ? Math.round(right / total * 100) : 0;
        $("score-big").textContent = right + " / " + total;
        $("score-pct").textContent = "正确率 " + pct + "%";

        const known = $("list-known");
        const unknown = $("list-unknown");
        known.innerHTML = "";
        unknown.innerHTML = "";
        const k = answers.filter(function (a) { return a.correct; });
        const u = answers.filter(function (a) { return !a.correct; });
        function fill(el, list) {
          if (!list.length) {
            const p = document.createElement("p");
            p.className = "empty";
            p.textContent = "没有";
            el.appendChild(p);
            return;
          }
          list.forEach(function (a) {
            const li = document.createElement("li");
            li.textContent = a.word;
            el.appendChild(li);
          });
        }
        fill(known, k);
        fill(unknown, u);
        show("result");
      }

      function startQuiz() {
        pool = data.words.slice();
        queue = shuffle(pool);
        index = 0;
        answers = [];
        locked = false;
        show("quiz");
        renderQuestion();
      }

      function loadData() {
        if (window.VOCAB_DATA && window.VOCAB_DATA.words && window.VOCAB_DATA.words.length) {
          return Promise.resolve(window.VOCAB_DATA);
        }
        return fetch("words.json").then(function (r) {
          if (!r.ok) throw new Error("words.json " + r.status);
          return r.json();
        });
      }

      $("btn-start").addEventListener("click", function () {
        if (!data) return;
        startQuiz();
      });
      $("btn-replay").addEventListener("click", function () {
        if (!locked) playCurrent();
      });
      $("btn-again").addEventListener("click", function () {
        startQuiz();
      });

      window.__vocabTest = {
        getState: function () {
          return {
            screen: screens.start.classList.contains("active") ? "start"
              : screens.quiz.classList.contains("active") ? "quiz" : "result",
            index: index,
            total: queue.length,
            currentWord: queue[index] ? queue[index].word : null,
            choices: currentChoices.map(function (c) { return c.word; }),
            answers: answers.slice(),
            score: answers.filter(function (a) { return a.correct; }).length,
          };
        },
      };

      loadData().then(function (d) {
        data = d;
        if (d.subtitle) $("subtitle").textContent = d.subtitle;
        const n = d.words.length;
        document.querySelector(".parent-note").textContent =
          "给家长：这是一个样品，共 " + n + " 个单词。测试过程中不会显示英文单词。";
      }).catch(function (err) {
        document.querySelector(".hint").textContent = "加载词表失败，请把整个文件夹放在一起再打开。";
        console.error(err);
      });
    })();
  </script>
</body>
</html>
