<!DOCTYPE html>
<html lang="zh-CN" data-version="2">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="单词听听看">
  <meta name="theme-color" content="#FFF6E9">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%A7%3C/text%3E%3C/svg%3E">
  <title>单词听听看 · 词汇量小测试</title>
  <style>
    :root {
      --bg1: #FFF6E9;
      --bg2: #D9F0FF;
      --ink: #2B2A4A;
      --muted: #6B6A86;
      --card: #ffffff;
      --accent: #FF8A5B;
      --accent-dark: #E56F40;
      --sky: #5BB4E8;
      --sky-dark: #3A98D0;
      --ok: #2FA36B;
      --ok-soft: #EEF8F0;
      --bad: #E07A7A;
      --shadow: 0 10px 30px rgba(43, 42, 74, 0.10);
      --radius: 28px;
      --pad-top: max(12px, env(safe-area-inset-top, 0px));
      --pad-bottom: max(16px, env(safe-area-inset-bottom, 0px));
      --pad-left: max(16px, env(safe-area-inset-left, 0px));
      --pad-right: max(16px, env(safe-area-inset-right, 0px));
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      min-height: 100dvh;
    }

    body {
      min-height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: clip;
      -webkit-overflow-scrolling: touch;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    #app {
      min-height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: var(--pad-top) var(--pad-right) var(--pad-bottom) var(--pad-left);
    }

    .screen { display: none; width: 100%; max-width: 1100px; }
    .screen.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1 0 auto;
      width: 100%;
    }

    #screen-start.active {
      justify-content: safe center;
      text-align: center;
      gap: 12px;
    }
    #screen-start.active::before,
    #screen-start.active::after {
      content: "";
      flex: 1 1 0;
      min-height: 8px;
    }
    .logo {
      width: 112px; height: 112px;
      border-radius: 32px;
      background: #fff;
      box-shadow: var(--shadow);
      display: flex; align-items: center; justify-content: center;
      font-size: 64px;
      margin-bottom: 8px;
    }
    h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 48px);
      letter-spacing: 0.04em;
    }
    .subtitle { margin: 0; color: var(--muted); font-size: 18px; }
    .hint {
      margin: 8px 0 28px;
      max-width: 420px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }
    .btn {
      appearance: none;
      border: none;
      cursor: pointer;
      font: inherit;
      touch-action: manipulation;
    }
    .btn-start {
      background: var(--accent);
      color: #fff;
      font-size: 32px;
      font-weight: 700;
      padding: 20px 88px;
      border-radius: 999px;
      box-shadow: 0 8px 0 var(--accent-dark), var(--shadow);
      min-width: 240px;
      min-height: 80px;
    }
    .btn-start:active { transform: translateY(4px); box-shadow: 0 4px 0 var(--accent-dark); }
    .parent-note { margin-top: 28px; font-size: 13px; color: #9A99B0; max-width: 440px; line-height: 1.6; }

    #screen-quiz.active {
      justify-content: safe center;
    }
    #screen-quiz.active::before,
    #screen-quiz.active::after {
      content: "";
      flex: 1 1 0;
      min-height: 0;
    }
    .quiz-top {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 4px 12px;
    }
    .stars {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      justify-content: center;
      min-height: 16px;
      max-width: 520px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255,255,255,0.75);
      box-shadow: inset 0 0 0 2px rgba(91,180,232,0.28);
    }
    .dot.filled { background: #F3D27A; box-shadow: none; }
    .dot.current { background: #fff; box-shadow: 0 0 0 2px #5BB4E8; }

    .speaker {
      margin: 4px 0 16px;
      width: 92px; height: 92px;
      border-radius: 50%;
      background: var(--sky);
      color: #fff;
      box-shadow: 0 6px 0 var(--sky-dark), var(--shadow);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      touch-action: manipulation;
    }
    .speaker:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--sky-dark); }
    .speaker.playing { animation: pulse 0.9s ease-in-out infinite; }
    .speaker svg { width: 48px; height: 48px; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    .choices {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(10px, 2vw, 18px);
      align-content: center;
      justify-items: center;
      padding: 4px 0 12px;
    }
    .choices.is-locked { pointer-events: none; }
    .choice {
      position: relative;
      background: var(--card);
      border: 4px solid transparent;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      cursor: pointer;
      width: 100%;
      max-width: min(100%, 52dvh, 420px);
      aspect-ratio: 1;
      min-height: 0;
      touch-action: manipulation;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.25s ease, border-color 0.2s ease, background 0.2s ease;
    }
    .choice img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }
    .choice:active { transform: scale(0.97); }
    .choice.correct {
      border-color: var(--ok);
      background: var(--ok-soft);
      box-shadow: 0 12px 32px rgba(47, 163, 107, 0.28);
      transform: scale(1.05);
      opacity: 1;
      z-index: 2;
    }
    .choice.wrong {
      border-color: var(--bad);
      background: #FFF4F4;
      animation: shake 0.5s ease;
    }
    .choice.dim { opacity: 0.38; transform: scale(0.96); }
    .feedback-badge {
      position: absolute;
      right: 8px;
      top: 8px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--ok);
      color: #fff;
      font-size: 22px;
      font-weight: 800;
      line-height: 36px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(47, 163, 107, 0.35);
      animation: pop 0.35s ease;
      pointer-events: none;
    }
    @keyframes pop {
      from { transform: scale(0); }
      70% { transform: scale(1.15); }
      to { transform: scale(1); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }
    .choices.leaving { opacity: 0; transform: translateY(8px); transition: opacity 0.28s ease, transform 0.28s ease; }
    .choices.entering { animation: enter 0.35s ease; }
    @keyframes enter {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }

    #screen-result.active {
      justify-content: flex-start;
      padding-bottom: 24px;
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }
    .score-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px 24px 24px;
      text-align: center;
      width: 100%;
      max-width: 560px;
      margin-top: 20px;
    }
    .score-card h2 { margin: 0 0 8px; font-size: 28px; }
    .score-big {
      font-size: clamp(44px, 8vw, 64px);
      font-weight: 800;
      margin: 8px 0 0;
      letter-spacing: -0.02em;
    }
    .score-pct { color: var(--muted); font-size: 20px; margin: 8px 0 0; }
    .attained {
      margin: 10px 0 0;
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
    }
    .btn-again {
      margin-top: 20px;
      background: var(--accent);
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      padding: 14px 40px;
      border-radius: 999px;
      box-shadow: 0 6px 0 var(--accent-dark);
    }
    .btn-again:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--accent-dark); }

    .level-wrap, .lists {
      width: 100%;
      max-width: 560px;
      margin-top: 20px;
    }
    .level-wrap {
      background: var(--card);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 16px 16px 12px;
      overflow-x: auto;
    }
    .level-wrap h3, .list-card h3 {
      margin: 0 0 10px;
      font-size: 16px;
    }
    .level-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }
    .level-table th, .level-table td {
      text-align: center;
      padding: 8px 6px;
      border-bottom: 1px solid #EEEAF8;
    }
    .level-table th { color: var(--muted); font-weight: 600; font-size: 13px; }
    .level-table td:first-child, .level-table th:first-child { text-align: left; }

    .list-card {
      background: var(--card);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 16px 16px 12px;
      min-height: 80px;
    }
    .list-card.unknown h3 { color: #C45C26; }
    .list-card ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .list-card li {
      background: #FFF1E8;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 15px;
      font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    }
    .list-card .empty { color: #9A99B0; font-size: 14px; }

    /* Portrait phone: 2+1 bigger pictures, page still scrolls if needed */
    @media (orientation: portrait) and (max-width: 640px) {
      .choices {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .choice {
        max-width: min(100%, 46vw, 280px);
        padding: 10px;
      }
      .choice:last-child:nth-child(odd) {
        grid-column: 1 / -1;
      }
      .speaker { width: 76px; height: 76px; }
      .speaker svg { width: 38px; height: 38px; }
      .feedback-badge { width: 32px; height: 32px; line-height: 32px; font-size: 18px; }
    }

    /* Landscape: keep 3 in a row, shrink to fit, scroll if still tall */
    @media (orientation: landscape) {
      .choices { grid-template-columns: repeat(3, 1fr); }
      .choice {
        max-width: min(100%, 62dvh, 360px);
        padding: 10px;
      }
    }
    @media (orientation: landscape) and (max-height: 700px) {
      .quiz-top { padding: 2px 4px 4px; }
      .speaker { width: 64px; height: 64px; margin: 2px 0 8px; }
      .speaker svg { width: 32px; height: 32px; }
      .choice { padding: 8px; border-radius: 22px; }
      .logo { width: 80px; height: 80px; font-size: 44px; margin-bottom: 0; }
      h1 { font-size: clamp(24px, 5vw, 36px); }
      .hint { margin: 4px 0 16px; }
      .btn-start { font-size: 26px; padding: 14px 64px; min-height: 60px; }
      .parent-note { margin-top: 12px; }
      .score-card { margin-top: 8px; padding: 18px 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .choice.wrong, .choices.entering, .speaker.playing, .feedback-badge { animation: none; }
    }
  </style>
</head>
<body>
  <div id="app">
    <section id="screen-start" class="screen active">
      <div class="logo" aria-hidden="true">🎧</div>
      <h1>单词听听看</h1>
      <p class="subtitle" id="subtitle">词汇量小测试</p>
      <p class="hint">点「开始」后会听到一个单词。<br>请让宝宝选出对应的那张图片。<br>听不清可以再点上面的小喇叭。</p>
      <button class="btn btn-start" id="btn-start" type="button">开 始</button>
      <p class="parent-note">给家长：这是一套自适应词汇量测试，从简单的开始，大约 20–30 题。测试过程中不会显示英文单词或级别。答对会亮绿灯并响起叮一声，答错会轻轻指出正确的那张图，再把单词读一遍。</p>
    </section>

    <section id="screen-quiz" class="screen">
      <div class="quiz-top">
        <div class="stars" id="stars" aria-hidden="true"></div>
      </div>
      <button class="btn speaker" id="btn-replay" type="button" aria-label="再听一次">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M8 18h8l10-8v28l-10-8H8V18z" fill="currentColor"/>
          <path d="M32 16c3.2 2.6 5 6.2 5 8s-1.8 5.4-5 8" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
          <path d="M36 11c5 4.2 7.8 9.6 7.8 13s-2.8 8.8-7.8 13" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
        </svg>
      </button>
      <div class="choices entering" id="choices"></div>
    </section>

    <section id="screen-result" class="screen">
      <div class="score-card">
        <h2>测试完成</h2>
        <div class="score-big" id="score-big">约 0 词</div>
        <p class="attained" id="attained">还未达到 P1 水平</p>
        <p class="score-pct" id="score-pct"></p>
        <button class="btn btn-again" id="btn-again" type="button">再测一次</button>
      </div>
      <div class="level-wrap">
        <h3>各级表现</h3>
        <table class="level-table">
          <thead>
            <tr><th>级别</th><th>题数</th><th>答对</th><th>正确率</th></tr>
          </thead>
          <tbody id="level-rows"></tbody>
        </table>
      </div>
      <div class="lists">
        <div class="list-card unknown">
          <h3>还不熟的单词</h3>
          <ul id="list-unknown"></ul>
        </div>
      </div>
    </section>
  </div>

  <script src="words.js?v=2"></script>
  <script>
    (function () {
      "use strict";

      var MAX_QUESTIONS = 30;
      var audio = new Audio();
      audio.preload = "auto";
      audio.setAttribute("playsinline", "true");
      audio.playsInline = true;

      var audioCtx = null;
      var data = null;
      var levels = [];
      var levelIndex = 0;
      var totalAsked = 0;
      var consecutiveFails = 0;
      var askedWords = [];
      var levelAskedCount = 0;
      var levelCorrect = 0;
      var levelResults = [];
      var answers = [];
      var locked = false;
      var currentItem = null;
      var currentChoices = [];
      var lastScore = null;
      var feedbackTimer = 0;
      var leaveTimer = 0;

      var $ = function (id) { return document.getElementById(id); };
      var screens = {
        start: $("screen-start"),
        quiz: $("screen-quiz"),
        result: $("screen-result"),
      };

      function show(name) {
        Object.keys(screens).forEach(function (k) {
          screens[k].classList.toggle("active", k === name);
        });
        try { window.scrollTo(0, 0); } catch (e) {}
      }

      function shuffle(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = a[i]; a[i] = a[j]; a[j] = t;
        }
        return a;
      }

      function getAudioCtx() {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        if (!audioCtx) {
          try { audioCtx = new AC(); } catch (e) { return null; }
        }
        if (audioCtx.state === "suspended") {
          try { audioCtx.resume(); } catch (e) {}
        }
        return audioCtx;
      }

      function unlockAudio() {
        var ctx = getAudioCtx();
        if (!ctx) return;
        try {
          var buf = ctx.createBuffer(1, 1, ctx.sampleRate || 22050);
          var src = ctx.createBufferSource();
          src.buffer = buf;
          src.connect(ctx.destination);
          src.start(0);
        } catch (e) {}
      }

      function tone(ctx, freq, start, dur, type, vol) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        var filter = ctx.createBiquadFilter();
        osc.type = type || "sine";
        osc.frequency.setValueAtTime(freq, start);
        filter.type = "lowpass";
        filter.frequency.value = 2200;
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(vol || 0.16, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + dur + 0.02);
      }

      function playChime() {
        var ctx = getAudioCtx();
        if (!ctx) return;
        var now = ctx.currentTime;
        tone(ctx, 523.25, now, 0.28, "sine", 0.15);
        tone(ctx, 659.25, now + 0.09, 0.30, "sine", 0.16);
        tone(ctx, 783.99, now + 0.18, 0.42, "triangle", 0.14);
        tone(ctx, 1046.5, now + 0.22, 0.38, "sine", 0.08);
      }

      function playOops() {
        var ctx = getAudioCtx();
        if (!ctx) return;
        var now = ctx.currentTime;
        tone(ctx, 392.00, now, 0.28, "sine", 0.11);
        tone(ctx, 329.63, now + 0.16, 0.36, "sine", 0.10);
      }

      function stopWordAudio() {
        try { audio.pause(); } catch (e) {}
        try { audio.currentTime = 0; } catch (e) {}
        audio.onended = null;
        audio.onpause = null;
        var btn = $("btn-replay");
        if (btn) btn.classList.remove("playing");
      }

      function playCurrent(onEnd) {
        if (!currentItem) return;
        stopWordAudio();
        audio.src = currentItem.audio;
        var btn = $("btn-replay");
        var finished = false;
        var done = function () {
          if (finished) return;
          finished = true;
          btn.classList.remove("playing");
          audio.onended = null;
          audio.onpause = null;
          if (onEnd) onEnd();
        };
        btn.classList.add("playing");
        audio.onended = done;
        var p = audio.play();
        if (p && p.catch) p.catch(function () { done(); });
        return done;
      }

      function clearTimers() {
        if (feedbackTimer) { window.clearTimeout(feedbackTimer); feedbackTimer = 0; }
        if (leaveTimer) { window.clearTimeout(leaveTimer); leaveTimer = 0; }
      }

      function renderStars() {
        var box = $("stars");
        box.innerHTML = "";
        var i;
        for (i = 0; i < totalAsked; i++) {
          var d = document.createElement("span");
          d.className = "dot" + (i < totalAsked - 1 ? " filled" : " current");
          box.appendChild(d);
        }
      }

      function pickDistractors(target, levelIdx) {
        var used = {};
        used[target.word] = true;
        var picks = [];
        function addFrom(idx) {
          if (idx < 0 || idx >= levels.length || picks.length >= 2) return;
          var cands = shuffle(levels[idx].pool.filter(function (w) { return !used[w.word]; }));
          for (var i = 0; i < cands.length && picks.length < 2; i++) {
            used[cands[i].word] = true;
            picks.push(cands[i]);
          }
        }
        addFrom(levelIdx);
        var d;
        for (d = 1; picks.length < 2 && d < levels.length; d++) {
          addFrom(levelIdx + d);
          addFrom(levelIdx - d);
        }
        return picks;
      }

      function askQuestion() {
        clearTimers();
        var level = levels[levelIndex];
        var available = level.pool.filter(function (w) {
          return askedWords.indexOf(w.word) === -1;
        });
        if (!available.length) {
          closeLevelAndAdvance(decideStatus());
          return;
        }
        currentItem = shuffle(available)[0];
        askedWords.push(currentItem.word);
        totalAsked += 1;
        currentChoices = shuffle([currentItem].concat(pickDistractors(currentItem, levelIndex)));

        renderStars();
        var box = $("choices");
        box.classList.remove("leaving", "is-locked");
        box.classList.add("entering");
        box.innerHTML = "";
        currentChoices.forEach(function (choice) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "choice";
          btn.setAttribute("data-word", choice.word);
          btn.setAttribute("data-correct", choice.word === currentItem.word ? "1" : "0");
          btn.setAttribute("aria-label", "picture choice");
          var img = document.createElement("img");
          img.src = choice.image;
          img.alt = "";
          img.draggable = false;
          btn.appendChild(img);
          btn.addEventListener("click", function () { onPick(choice, btn); });
          box.appendChild(btn);
        });
        locked = false;
        playCurrent();
      }

      function decideStatus() {
        var p = levelAskedCount ? levelCorrect / levelAskedCount : 0;
        if (levelAskedCount >= 3 && levelCorrect === levelAskedCount && levelAskedCount === 3) return "pass";
        if (levelAskedCount === 5 && levelCorrect >= 4) return "pass";
        if (p <= 1 / 3) return "fail";
        if (levelAskedCount === 3 && levelCorrect === 3) return "pass";
        return "near";
      }

      function closeLevel(status) {
        var lv = levels[levelIndex];
        var p = levelAskedCount ? levelCorrect / levelAskedCount : 0;
        var missed = answers.filter(function (a) {
          return a.level === lv.id && !a.correct;
        }).map(function (a) { return a.word; });
        levelResults.push({
          id: lv.id,
          index: levelIndex,
          asked: levelAskedCount,
          correct: levelCorrect,
          p: p,
          status: status,
          unknown: missed
        });
        if (status === "fail") consecutiveFails += 1;
        else consecutiveFails = 0;
      }

      function beginLevel(i) {
        levelIndex = i;
        askedWords = [];
        levelAskedCount = 0;
        levelCorrect = 0;
        askQuestion();
      }

      function closeLevelAndAdvance(status) {
        closeLevel(status);
        if (consecutiveFails >= 2) {
          finish();
          return;
        }
        if (levelIndex >= levels.length - 1) {
          finish();
          return;
        }
        if (totalAsked >= MAX_QUESTIONS) {
          finish();
          return;
        }
        beginLevel(levelIndex + 1);
      }

      function afterAnswer() {
        var asked = levelAskedCount;
        var correct = levelCorrect;
        var hitCap = totalAsked >= MAX_QUESTIONS;

        if (asked === 3 && correct === 3) {
          closeLevelAndAdvance("pass");
          return;
        }
        if (asked === 3 && correct <= 1) {
          closeLevelAndAdvance("fail");
          return;
        }
        if (asked === 3 && correct === 2) {
          if (hitCap) {
            closeLevelAndAdvance("near");
            return;
          }
          askQuestion();
          return;
        }
        if (asked === 5) {
          closeLevelAndAdvance(correct >= 4 ? "pass" : "near");
          return;
        }
        if (hitCap) {
          closeLevelAndAdvance(decideStatus());
          return;
        }
        askQuestion();
      }

      function addBadge(el) {
        var badge = document.createElement("span");
        badge.className = "feedback-badge";
        badge.setAttribute("aria-hidden", "true");
        badge.textContent = "✓";
        el.appendChild(badge);
      }

      function leaveAndNext() {
        var box = $("choices");
        box.classList.remove("entering");
        box.classList.add("leaving");
        leaveTimer = window.setTimeout(function () {
          leaveTimer = 0;
          afterAnswer();
        }, 280);
      }

      function onPick(choice, btn) {
        if (locked) return;
        locked = true;
        var correct = choice.word === currentItem.word;
        levelAskedCount += 1;
        if (correct) levelCorrect += 1;
        answers.push({
          word: currentItem.word,
          level: levels[levelIndex].id,
          levelIndex: levelIndex,
          correct: correct,
          picked: choice.word
        });

        stopWordAudio();
        var box = $("choices");
        box.classList.add("is-locked");
        Array.prototype.forEach.call(box.querySelectorAll(".choice"), function (el) {
          var isCorrectCard = el.getAttribute("data-correct") === "1";
          if (correct) {
            if (el === btn) {
              el.classList.add("correct");
              addBadge(el);
            } else {
              el.classList.add("dim");
            }
          } else {
            if (el === btn) {
              el.classList.add("wrong");
            } else if (isCorrectCard) {
              el.classList.add("correct");
              addBadge(el);
            } else {
              el.classList.add("dim");
            }
          }
        });

        if (correct) playChime();
        else playOops();

        var hold = correct ? 950 : 1100;
        feedbackTimer = window.setTimeout(function () {
          feedbackTimer = 0;
          if (correct) {
            leaveAndNext();
            return;
          }
          var moved = false;
          var go = function () {
            if (moved) return;
            moved = true;
            leaveAndNext();
          };
          playCurrent(go);
          feedbackTimer = window.setTimeout(go, 2000);
        }, hold);
      }

      function computeScore() {
        var n = levels.length;
        var q = [];
        var i;
        for (i = 0; i < n; i++) q[i] = null;
        var first = -1, last = -1;
        var byId = {};
        levelResults.forEach(function (r) { byId[r.id] = r; });
        for (i = 0; i < n; i++) {
          var r = byId[levels[i].id];
          if (r && r.asked > 0) {
            var p = r.correct / r.asked;
            q[i] = Math.max(0, (p * 3 - 1) / 2);
            if (first < 0) first = i;
            last = i;
          }
        }
        if (first < 0) {
          return { q: q.map(function () { return 0; }), estimate: 0, rounded: 0, attained: null };
        }
        for (i = 0; i < first; i++) q[i] = 1;
        for (i = last + 1; i < n; i++) q[i] = 0;
        i = first;
        while (i <= last) {
          if (q[i] !== null) { i++; continue; }
          var a = i - 1;
          var b = i + 1;
          while (b <= last && q[b] === null) b++;
          var k;
          for (k = a + 1; k < b; k++) {
            q[k] = q[a] + ((k - a) / (b - a)) * (q[b] - q[a]);
          }
          i = b;
        }
        var raw = 0;
        for (i = 0; i < n; i++) raw += (q[i] || 0) * (levels[i].newWordCount || 0);
        var rounded = Math.round(raw / 10) * 10;
        var attained = null;
        for (i = 0; i < levelResults.length; i++) {
          var lr = levelResults[i];
          if (lr.asked > 0 && lr.correct / lr.asked >= 0.7) attained = lr.id;
        }
        return { q: q, estimate: raw, rounded: rounded, attained: attained, first: first, last: last };
      }

      function finish() {
        clearTimers();
        stopWordAudio();
        lastScore = computeScore();
        $("score-big").textContent = "约 " + lastScore.rounded + " 词";
        if (lastScore.attained) {
          $("attained").textContent = "达到 " + lastScore.attained + " 水平";
        } else {
          $("attained").textContent = "还未达到 P1 水平";
        }
        $("score-pct").textContent = "共测 " + answers.length + " 题";

        var tbody = $("level-rows");
        tbody.innerHTML = "";
        levelResults.forEach(function (r) {
          var tr = document.createElement("tr");
          var pct = r.asked ? Math.round(r.p * 100) : 0;
          tr.innerHTML = "<td>" + r.id + "</td><td>" + r.asked + "</td><td>" + r.correct + "</td><td>" + pct + "%</td>";
          tbody.appendChild(tr);
        });

        var unknown = $("list-unknown");
        unknown.innerHTML = "";
        var missed = answers.filter(function (a) { return !a.correct; });
        if (!missed.length) {
          var p = document.createElement("p");
          p.className = "empty";
          p.textContent = "没有";
          unknown.appendChild(p);
        } else {
          missed.forEach(function (a) {
            var li = document.createElement("li");
            li.textContent = a.word;
            unknown.appendChild(li);
          });
        }
        show("result");
      }

      function startQuiz() {
        clearTimers();
        stopWordAudio();
        levelIndex = 0;
        totalAsked = 0;
        consecutiveFails = 0;
        askedWords = [];
        levelAskedCount = 0;
        levelCorrect = 0;
        levelResults = [];
        answers = [];
        locked = false;
        currentItem = null;
        currentChoices = [];
        lastScore = null;
        show("quiz");
        beginLevel(0);
      }

      function loadData() {
        if (window.VOCAB_DATA && window.VOCAB_DATA.levels && window.VOCAB_DATA.levels.length) {
          return Promise.resolve(window.VOCAB_DATA);
        }
        return fetch("words.json").then(function (r) {
          if (!r.ok) throw new Error("words.json " + r.status);
          return r.json();
        });
      }

      $("btn-start").addEventListener("click", function () {
        if (!data) return;
        unlockAudio();
        startQuiz();
      });
      $("btn-replay").addEventListener("click", function () {
        if (!locked) playCurrent();
      });
      $("btn-again").addEventListener("click", function () {
        unlockAudio();
        startQuiz();
      });

      window.addEventListener("orientationchange", function () {
        window.setTimeout(function () {
          try {
            var active = document.querySelector(".screen.active");
            if (active) active.offsetHeight;
          } catch (e) {}
        }, 120);
      });

      window.__vocabTest = {
        version: "2",
        getState: function () {
          var screen = screens.start.classList.contains("active") ? "start"
            : screens.quiz.classList.contains("active") ? "quiz" : "result";
          return {
            screen: screen,
            locked: locked,
            currentLevel: levels[levelIndex] ? levels[levelIndex].id : null,
            currentLevelIndex: levelIndex,
            currentWord: currentItem ? currentItem.word : null,
            choices: currentChoices.map(function (c) { return c.word; }),
            answers: answers.slice(),
            totalAsked: totalAsked,
            levelAsked: levelAskedCount,
            levelCorrect: levelCorrect,
            consecutiveFails: consecutiveFails,
            levelResults: levelResults.slice(),
            estimate: lastScore ? lastScore.rounded : null,
            rawEstimate: lastScore ? lastScore.estimate : null,
            attained: lastScore ? lastScore.attained : null
          };
        }
      };

      loadData().then(function (d) {
        data = d;
        levels = d.levels || [];
        if (d.subtitle) $("subtitle").textContent = d.subtitle;
      }).catch(function (err) {
        document.querySelector(".hint").textContent = "加载词表失败，请把整个文件夹放在一起再打开。";
        console.error(err);
      });
    })();
  </script>
</body>
</html>
